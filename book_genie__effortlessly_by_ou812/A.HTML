<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Genie Intro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Minimal intro scene with animated flashlight + eyes */
    html, body {
      height: 100%;
      margin: 0;
    }
    .scene {
      width: 100vw;
      height: 100vh;
      min-height: 350px;
      margin: 0;
      position: relative;
      background-color: #111;
      /* background layers (subtle texture) */
      background-image:
        linear-gradient(to top, #222 5%, #111 6%, #111 7%, transparent 7%),
        linear-gradient(to bottom, #111 30%, transparent 30%),
        linear-gradient(to right, #222, #2e2e2e 5%, transparent 5%),
        linear-gradient(to right, transparent 6%, #222 6%, #2e2e2e 9%, transparent 9%),
        linear-gradient(to right, transparent 27%, #222 27%, #2e2e2e 34%, transparent 34%),
        linear-gradient(to right, transparent 51%, #222 51%, #2e2e2e 57%, transparent 57%),
        linear-gradient(to bottom, #111 35%, transparent 35%),
        linear-gradient(to right, transparent 42%, #222 42%, #2e2e2e 44%, transparent 44%),
        linear-gradient(to right, transparent 45%, #222 45%, #2e2e2e 47%, transparent 47%),
        linear-gradient(to right, transparent 48%, #222 48%, #2e2e2e 50%, transparent 50%),
        linear-gradient(to right, transparent 87%, #222 87%, #2e2e2e 91%, transparent 91%),
        linear-gradient(to bottom, #111 37.5%, transparent 37.5%),
        linear-gradient(to right, transparent 14%, #222 14%, #2e2e2e 20%, transparent 20%),
        linear-gradient(to bottom, #111 40%, transparent 40%),
        linear-gradient(to right, transparent 10%, #222 10%, #2e2e2e 13%, transparent 13%),
        linear-gradient(to right, transparent 21%, #222 21%, #1a1a1a 25%, transparent 25%),
        linear-gradient(to right, transparent 58%, #222 58%, #2e2e2e 64%, transparent 64%),
        linear-gradient(to right, transparent 92%, #222 92%, #2e2e2e 95%, transparent 95%),
        linear-gradient(to bottom, #111 48%, transparent 48%),
        linear-gradient(to right, transparent 96%, #222 96%, #1a1a1a 99%, transparent 99%),
        linear-gradient(to bottom, transparent 68.5%, transparent 76%, #111 76%, #111 77.5%, transparent 77.5%, transparent 86%, #111 86%, #111 87.5%, transparent 87.5%),
        linear-gradient(to right, transparent 35%, #222 35%, #2e2e2e 41%, transparent 41%),
        linear-gradient(to bottom, #111 68%, transparent 68%),
        linear-gradient(to right, transparent 78%, #333 78%, #333 80%, transparent 80%, transparent 82%, #333 82%, #333 83%, transparent 83%),
        linear-gradient(to right, transparent 66%, #222 66%, #2e2e2e 85%, transparent 85%);
      background-size: 300px 150px;
      background-position: center bottom;
      overflow: hidden;
    }
    .scene::before {
      /* flashlight cone sweeping */
      content: '';
      position: absolute;
      inset: 0;
      background-color: #111;
      background-image:
        linear-gradient(to top, #d2b48c 5%, #111 6%, #111 7%, transparent 7%),
        linear-gradient(to bottom, #111 30%, transparent 30%),
        linear-gradient(to right, #b22222, #871a1a 5%, transparent 5%),
        linear-gradient(to right, transparent 6%, #ff6347 6%, #ff3814 9%, transparent 9%),
        linear-gradient(to right, transparent 27%, #556b2f 27%, #39481f 34%, transparent 34%),
        linear-gradient(to right, transparent 51%, #fa8072 51%, #f85441 57%, transparent 57%),
        linear-gradient(to bottom, #111 35%, transparent 35%),
        linear-gradient(to right, transparent 42%, #008080 42%, #004d4d 44%, transparent 44%),
        linear-gradient(to right, transparent 45%, #008080 45%, #004d4d 47%, transparent 47%),
        linear-gradient(to right, transparent 48%, #008080 48%, #004d4d 50%, transparent 50%),
        linear-gradient(to right, transparent 87%, #789 87%, #4f5d6a 91%, transparent 91%),
        linear-gradient(to bottom, #111 37.5%, transparent 37.5%),
        linear-gradient(to right, transparent 14%, #bdb76b 14%, #989244 20%, transparent 20%),
        linear-gradient(to bottom, #111 40%, transparent 40%),
        linear-gradient(to right, transparent 10%, #808000 10%, #4d4d00 13%, transparent 13%),
        linear-gradient(to right, transparent 21%, #8b4513 21%, #5e2f0d 25%, transparent 25%),
        linear-gradient(to right, transparent 58%, #8b4513 58%, #5e2f0d 64%, transparent 64%),
        linear-gradient(to right, transparent 92%, #2f4f4f 92%, #1c2f2f 95%, transparent 95%),
        linear-gradient(to bottom, #111 48%, transparent 48%),
        linear-gradient(to right, transparent 96%, #2f4f4f 96%, #1c2f2f 99%, transparent 99%),
        linear-gradient(to bottom, transparent 68.5%, transparent 76%, #111 76%, #111 77.5%, transparent 77.5%, transparent 86%, #111 86%, #111 87.5%, transparent 87.5%),
        linear-gradient(to right, transparent 35%, #cd5c5c 35%, #bc3a3a 41%, transparent 41%),
        linear-gradient(to bottom, #111 68%, transparent 68%),
        linear-gradient(to right, transparent 78%, #bc8f8f 78%, #bc8f8f 80%, transparent 80%, transparent 82%, #bc8f8f 82%, #bc8f8f 83%, transparent 83%),
        linear-gradient(to right, transparent 66%, #a52a2a 66%, #7c2020 85%, transparent 85%);
      clip-path: circle(150px at 45% 10%);
      animation: flashlight var(--anim-duration, 5000ms) infinite;
    }
    .scene::after {
      /* blinking eyes revealed in the cone */
      content: '';
      position: absolute;
      left: calc(50% + 59px);
      bottom: 100px;
      width: 25px;
      height: 10px;
      background-repeat: no-repeat;
      background-image:
        radial-gradient(circle, var(--eye-color, #fff) 50%, transparent 50%),
        radial-gradient(circle, var(--eye-color, #fff) 50%, transparent 50%);
      background-size: 10px 10px;
      background-position: left center, right center;
      animation: eyes var(--anim-duration, 5000ms) infinite;
      opacity: 0;
    }

    @keyframes flashlight {
      0%, 9% {
        opacity: 0;
        clip-path: circle(150px at 45% 10%);
      }
      10%, 15%, 85% {
        opacity: 1;
      }
      50% {
        clip-path: circle(150px at 60% 20%);
      }
      54%, 100% {
        clip-path: circle(150px at 55% 92%);
      }
      88%, 100% {
        opacity: 0;
      }
    }
    @keyframes eyes {
      0%, 52% { opacity: 0; }
      53%, 87% { opacity: 1; }
      64%   { transform: scaleY(1); }
      67%   { transform: scaleY(0); }
      70%   { transform: scaleY(1); }
      88%, 100% { opacity: 0; }
    }

    /* Optional helper text (hidden by default) */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0;
      margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <div class="sr-only" aria-live="polite" id="aria-status">Intro playing...</div>

  <script>
    // Tweakable controls for this intro handoff page

    /** @tweakable redirectEnabled Whether to auto-redirect to the Community Library after the intro */
    const redirectEnabled = true;

    /** @tweakable redirectAfterCycles Number of animation cycles to wait before redirecting */
    const redirectAfterCycles = 2;

    /** @tweakable animationCycleMs Duration of a single animation cycle in milliseconds */
    const animationCycleMs = 5000;

    /** @tweakable eyeColor Hex or CSS color for the blinking eyes */
    const eyeColor = '#fff';

    /** @tweakable redirectUrl The URL of the Community Library page to open */
    const redirectUrl = 'community-library.html';

    /** @tweakable openInNewTab Open the Community Library in a new tab instead of same tab */
    const openInNewTab = false;

    /** @tweakable introFadeOutMs Fade-out duration (ms) before navigating */
    const introFadeOutMs = 450;

    /** @tweakable ariaIntroStatusText Screen-reader status text during intro/redirect */
    const ariaIntroStatusText = 'Intro playing. Redirecting soon...';

    // Apply visual tweaks
    try {
      const root = document.documentElement;
      root.style.setProperty('--anim-duration', animationCycleMs + 'ms');
      root.style.setProperty('--eye-color', eyeColor);
    } catch {}

    // Run intro then redirect
    (function runIntroAndRedirect() {
      const totalWait = Math.max(1, redirectAfterCycles) * Math.max(100, animationCycleMs);
      const status = document.getElementById('aria-status');
      if (status) status.textContent = ariaIntroStatusText;

      if (!redirectEnabled) return;

      setTimeout(() => {
        try {
          // Optional fade out
          const scene = document.querySelector('.scene');
          if (scene) {
            scene.style.transition = `opacity ${introFadeOutMs}ms ease`;
            scene.style.opacity = '0';
          }
        } catch {}

        setTimeout(() => {
          if (openInNewTab) {
            window.open(redirectUrl, '_blank', 'noopener,noreferrer');
          } else {
            window.location.href = redirectUrl;
          }
        }, introFadeOutMs);
      }, totalWait);
    })();
  </script>
</body>
</html>
